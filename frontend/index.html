<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Devils Eyes</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="eye" aria-hidden="true">&lt;((|@|))&gt;</span> Devils Eyes</div>
    <nav id="nav" class="nav" hidden>
      <select id="project" aria-label="Project"></select>
      <button data-view="overview">Overview</button>
      <button data-view="runs">Runs</button>
      <button data-view="alerts">Alerts</button>
      <button data-view="changes">Changes</button>
      <button data-view="assets">Inventory</button>
      <button data-view="candidates">Candidates</button>
      <button data-view="findings">Findings</button>
      <button data-view="intelligence">Intelligence</button>
      <button data-view="scope">Scope</button>
      <button data-view="settings">Settings</button>
      <button id="signout" class="quiet">Sign out</button>
    </nav>
  </header>

  <main id="main">
    <section id="signin" class="panel narrow">
      <h1>Sign in</h1>
      <p>Run <strong>Copy-Dashboard-Token.cmd</strong> in your Windows project folder, then paste the copied token below.</p>
      <form id="signin-form">
        <label for="token">API token</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="wt_xxxxxxxx_..." required>
        <button type="submit">Sign in</button>
      </form>
      <p class="hint">The helper copies the token for your selected terminal project. Your token stays in this browser tab. You can also paste an existing API token.</p>
    </section>
    <section id="view" hidden></section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite"></div>
</body>
</html>
